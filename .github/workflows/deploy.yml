name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix Permissions (Pre-Cleanup)
        run: |
          # Force delete the work directory in case root-owned files exist
          # This requires the runner user to have passwordless sudo for rm, or ownership fix
          # A safer approach is to just claim ownership
          echo "Fixing permissions..."
          sudo chown -R $USER:$USER . || true

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "Error: ENV_FILE secret is empty!"
            exit 1
          fi
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build and Start Services
        run: |
          # Check for docker compose v2 vs v1
          if docker compose version &> /dev/null; then
              DC_CMD="docker compose"
          elif command -v docker-compose &> /dev/null; then
              DC_CMD="docker-compose"
          else
              echo "Error: Docker Compose not found"
              exit 1
          fi
          
          echo "Deploying with $DC_CMD..."
          $DC_CMD -f docker-compose.prod.yaml down --remove-orphans || true
          $DC_CMD -f docker-compose.prod.yaml up -d --build

      - name: Database Maintenance
        run: |
          if docker compose version &> /dev/null; then
              DC_CMD="docker compose"
          elif command -v docker-compose &> /dev/null; then
              DC_CMD="docker-compose"
          else
              echo "Error: Docker Compose not found"
              exit 1
          fi

          echo "Running Schema Updates..."
          $DC_CMD -f docker-compose.prod.yaml exec -T worker python update_schema.py
          
          echo "Running Data Backfill..."
          $DC_CMD -f docker-compose.prod.yaml exec -T worker python scripts/backfill_data.py
