services:
  # 1. Base de datos (Persistencia de precios)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pricedb
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: postgres -c timezone=America/Mexico_City

  # 2. Redis (Cola de tareas)
  redis:
    image: redis:alpine

  # 3. Tu Worker (El código Python)
  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=3
    volumes:
      - .:/code # Montamos el código para desarrollar sin reconstruir
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/pricedb
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_HIGH_PRIORITY_CHAT_ID=${TELEGRAM_HIGH_PRIORITY_CHAT_ID}
      - TZ=America/Mexico_City
    depends_on:
      - redis
      - db

  # 4. Beat (El cron que agenda las revisiones)
  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - .:/code
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TZ=America/Mexico_City
    depends_on:
      - redis

  # 5.1 Backend TypeScript (NestJS)
  backend-ts:
    command: npx ts-node src/main.ts
    build: ./backend-ts
    volumes:
      - ./backend-ts/src:/app/src
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/pricedb
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Mexico_City
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_HIGH_PRIORITY_CHAT_ID=${TELEGRAM_HIGH_PRIORITY_CHAT_ID}
      - CRAWLEE_MEMORY_MB=800
    ports:
      - "3002:3000"
    depends_on:
      - db
      - redis

  # 5. API (Homepage Integration)
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/pricedb
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_HIGH_PRIORITY_CHAT_ID=${TELEGRAM_HIGH_PRIORITY_CHAT_ID}
      - TZ=America/Mexico_City
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis

  # 6. Frontend (React/Vite)
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:4173"
    command: sh -c "npm install && npm run build && npm run preview -- --host --port 4173"
    depends_on:
      - api

  # 7. Adminer (Database UI)
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
